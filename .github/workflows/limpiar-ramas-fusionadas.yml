name: Limpiar ramas fusionadas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: limpiar-ramas-fusionadas
  cancel-in-progress: false

jobs:
  limpiar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener código vigente
        uses: actions/checkout@v4
      - name: Verificar política de limpieza
        run: node tests/ramas-fusionadas.js
      - name: Retirar solo ramas de PR fusionadas y sin modificaciones posteriores
        uses: actions/github-script@v7
        with:
          script: |
            const { ejecutar } = require('./scripts/limpiar-ramas-fusionadas.js');
            await ejecutar({github, context, core});
