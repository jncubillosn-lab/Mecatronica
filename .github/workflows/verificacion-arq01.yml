name: Verificación ARQ-01

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias declaradas
        run: npm ci
      - name: Contrato, escenarios, cálculo e integración
        run: npm test
      - name: Probar herramienta externa de normalización del SIA
        run: python3 -m unittest pruebas/test_normalizador.py -v
      - name: Exigir nueva versión para cambios del sitio
        if: github.event_name == 'pull_request'
        run: node tests/versionado.js --compare-main
